<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>防災Sowing 会員アプリ</title>
<style>
:root{--green:#315d42;--lime:#a8c96a;--bg:#f5f7f3;--ink:#203126}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:white;padding:22px 18px}header h1{margin:0;font-size:24px}header p{margin:8px 0 0;font-size:13px}
main{max-width:720px;margin:auto;padding:16px}.panel{background:white;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px #0000000b}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cbd5cb;border-radius:9px;background:white}textarea{min-height:75px}
button{border:0;border-radius:10px;padding:12px 15px;background:var(--green);color:white;font:inherit;font-weight:700;margin-top:10px}
button.secondary{background:#e8eee7;color:var(--green)}.event{border:1px solid #e0e7df;border-radius:12px;padding:13px;margin:10px 0}
.event h3{margin:0 0 8px;font-size:17px}.meta{font-size:13px;color:#536357;line-height:1.6}.event p{white-space:pre-wrap;margin:8px 0}
.tag{display:inline-block;background:#edf3e4;color:#4c692d;padding:3px 8px;border-radius:20px;font-size:12px}
small{color:#647064}.empty{color:#718071;font-size:14px}
</style>
</head>
<body>
<header><h1>防災Sowing</h1><p>防災の種をまこう‼︎　会員イベント</p></header>
<main>
<section class="panel"><h2>イベントを登録</h2>
<label>タイトル</label><input id="title" placeholder="例：防災講習会">
<label>日時</label><input id="date" type="datetime-local">
<label>場所</label><input id="place" placeholder="会場・住所など">
<label>内容</label><textarea id="content" placeholder="イベントの内容"></textarea>
<label>募集人数（任意）</label><input id="capacity" type="number" min="1" placeholder="例：20">
<label>追加情報（任意）</label><textarea id="extra" placeholder="持ち物・注意事項など"></textarea>
<button onclick="addEvent()">イベントを登録する</button>
<small>※この試作版では、登録内容はこの端末のブラウザ内に保存されます。</small>
</section>
<section class="panel"><h2>イベント一覧</h2><div id="events" class="empty">イベントはまだありません。</div></section>
</main>
<script>
const KEY='sowing_events_demo_v1';
function getEvents(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveEvents(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addEvent(){
 const title=document.getElementById('title').value.trim(),date=document.getElementById('date').value,place=document.getElementById('place').value.trim(),content=document.getElementById('content').value.trim(),capacity=document.getElementById('capacity').value,extra=document.getElementById('extra').value.trim();
 if(!title||!date||!place||!content){alert('タイトル・日時・場所・内容を入力してね');return}
 const a=getEvents();a.unshift({id:Date.now(),title,date,place,content,capacity,extra,participants:[]});saveEvents(a);['title','date','place','content','capacity','extra'].forEach(id=>document.getElementById(id).value='');render()
}
function join(id){const name=prompt('参加する人の名前（ニックネームでもOK）');if(!name||!name.trim())return;const a=getEvents(),e=a.find(x=>x.id===id);if(!e)return;if(e.participants.some(n=>n.toLowerCase()===name.trim().toLowerCase())){alert('この名前はすでに参加登録されています');return}e.participants.push(name.trim());saveEvents(a);render()}
function leave(id){const name=prompt('参加を取り消す名前を入力してね');if(!name)return;const a=getEvents(),e=a.find(x=>x.id===id);if(!e)return;e.participants=e.participants.filter(n=>n!==name.trim());saveEvents(a);render()}
function del(id){if(!confirm('このイベントを削除しますか？'))return;saveEvents(getEvents().filter(x=>x.id!==id));render()}
function render(){const a=getEvents(),root=document.getElementById('events');if(!a.length){root.className='empty';root.textContent='イベントはまだありません。';return}root.className='';root.innerHTML=a.map(e=>`<article class="event"><h3>${esc(e.title)}</h3><div class="meta">📅 ${esc(e.date.replace('T',' '))}<br>📍 ${esc(e.place)}<br>👥 参加 ${e.participants.length}人${e.capacity?' / 募集 '+esc(e.capacity)+'人':''}</div><p>${esc(e.content)}</p>${e.extra?`<p><small>${esc(e.extra)}</small></p>`:''}<span class="tag">参加者</span><p>${e.participants.length?e.participants.map(esc).join('、'):'まだ参加者はいません'}</p><button onclick="join(${e.id})">参加する</button> <button class="secondary" onclick="leave(${e.id})">参加を取り消す</button> <button class="secondary" onclick="del(${e.id})">削除</button></article>`).join('')}
render();
</script>
</body></html>
